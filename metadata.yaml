name: astrbot_plugin_daily_report
display_name: 每日早报
desc: 微信/QQ/Telegram 多平台通用早报插件：对机器人说「早」即收到天气（冷热对比+增减衣提示+明后天）+ 今日头条新闻 + 加密货币行情（24h涨跌+本月走势）+ 每日一言。主动对话触发而非定时推送，规避微信平台主动消息条数限制，零key零依赖。
help: 对机器人发送「早」「早上好」「早安」「早报」「morning」触发；天气城市与经纬度、加密货币开关与币种列表均可在插件配置中修改
version: 5.0.1
